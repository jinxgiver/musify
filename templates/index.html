<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musify</title>
  <meta name="theme-color" content="#0b0816">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="/static/icon.svg" alt=""><span>Musify</span></div>
    <nav class="nav">
      <a href="#/home" data-route="home"><i data-icon="home"></i><span>Home</span></a>
      <a href="#/search" data-route="search"><i data-icon="search"></i><span>Search</span></a>
      <a href="#/library" data-route="library"><i data-icon="library"></i><span>Library</span></a>
    </nav>
    <div class="side-section">
      <div class="side-head"><span>Playlists</span><button id="new-playlist" title="New playlist" aria-label="New playlist"><i data-icon="plus"></i></button></div>
      <ul id="playlist-list"></ul>
    </div>
    <button id="install-btn" class="btn" hidden><i data-icon="install"></i> Install app</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <label class="search"><i data-icon="search"></i>
        <input id="search" type="search" placeholder="What do you want to play?" autocomplete="off">
      </label>
    </header>
    <div id="view" class="view"></div>
  </main>

  <footer class="player">
    <div class="np">
      <div id="np-cover" class="cover mini-lg empty"><span>&#9835;</span></div>
      <div class="np-text"><div id="np-title" class="np-title">Nothing playing</div><div id="np-artist" class="np-artist">Pick a song to start</div></div>
      <button id="np-like" class="icon-btn" title="Like" aria-label="Like"><i data-icon="heart"></i></button>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="btn-shuffle" class="icon-btn" title="Shuffle" aria-label="Shuffle"><i data-icon="shuffle"></i></button>
        <button id="btn-prev" class="icon-btn" title="Previous" aria-label="Previous"><i data-icon="prev"></i></button>
        <button id="btn-play" class="play-btn" title="Play" aria-label="Play"><i data-icon="play"></i></button>
        <button id="btn-next" class="icon-btn" title="Next" aria-label="Next"><i data-icon="next"></i></button>
        <button id="btn-repeat" class="icon-btn" title="Repeat" aria-label="Repeat" data-mode="off"><i data-icon="repeat"></i></button>
      </div>
      <div class="seekrow">
        <span id="t-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="vol">
      <i data-icon="volume"></i>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
